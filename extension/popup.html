<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; font-family: system-ui, sans-serif; background: #0f121b; color: #e2e8f0; }
  header { padding: 12px 14px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; justify-content: space-between; align-items: center; }
  header small { color: #94a3b8; font-weight: 400; }
  #list { max-height: 320px; overflow-y: auto; padding: 8px; }
  .row { width: 100%; display: flex; justify-content: space-between; gap: 8px; align-items: center; background: none; border: 0; color: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
  .row:hover { background: rgba(255,255,255,.06); }
  .row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .u { color: #94a3b8; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .totp { font-size: 11px; color: #818cf8; border: 1px solid rgba(129,140,248,.4); border-radius: 6px; padding: 2px 6px; background: none; cursor: pointer; }
  .empty, .err { padding: 20px; text-align: center; color: #94a3b8; font-size: 13px; }
  footer { padding: 8px 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; color: #64748b; display: flex; justify-content: space-between; }
  footer button { background: none; border: 0; color: #818cf8; cursor: pointer; font-size: 11px; }
</style>
</head>
<body>
<header><span>CipherSync</span><small id="host"></small></header>
<div id="list"><div class="empty">Loading…</div></div>
<footer><span id="status"></span><button id="lock">Lock vault</button></footer>
<script src="popup.js"></script>
</body>
</html>
