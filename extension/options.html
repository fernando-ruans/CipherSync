<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; background: #0f121b; color: #e2e8f0; padding: 24px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 18px; }
  p { color: #94a3b8; font-size: 13px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  button { margin-top: 12px; background: #6366f1; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #msg { margin-top: 12px; font-size: 13px; }
  code { background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<h1>CipherSync extension</h1>
<p>1. In CipherSync desktop: <b>Settings → Browser extension → Generate pairing code</b>.<br>
2. Paste the code below and pair. The desktop vault must be <b>unlocked</b>.</p>
<label>Pairing code</label>
<input id="code" placeholder="XXXXXXXX" autocomplete="off">
<button id="pair">Pair</button>
<div style="margin-top:16px">
  <button id="ping" style="background:#1c2233">Check host status</button>
</div>
<p id="msg"></p>
<script src="options.js"></script>
</body>
</html>
